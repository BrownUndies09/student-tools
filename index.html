<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weighted GPA Calculator | Free GPA & Grade Calculator Worldwide</title>
<meta name="description" content="Free weighted GPA calculator for students worldwide. Supports US 4.0 scale, UK honours, South African NSC/APS, Indian CGPA, and more. No sign-up required.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: white;
    padding: 40px 30px;
    text-align: center;
  }
  header h1 { font-size: 28px; margin-bottom: 10px; }
  header p { opacity: 0.9; font-size: 15px; }
  .content { padding: 30px; }
  .country-selector { margin-bottom: 25px; }
  .country-selector label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #666;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .country-selector select {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    background: white;
    cursor: pointer;
  }
  .country-selector select:focus { outline: none; border-color: #4f46e5; }
  .info-box {
    background: #f0f4ff;
    border-left: 4px solid #4f46e5;
    padding: 15px 20px;
    border-radius: 8px;
    margin-bottom: 25px;
    font-size: 14px;
    line-height: 1.6;
  }
  .subject-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 40px;
    gap: 10px;
    margin-bottom: 10px;
    align-items: center;
  }
  .header-row {
    font-weight: 600;
    font-size: 13px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    font-size: 14px;
    transition: border 0.2s;
    background: white;
  }
  input:focus, select:focus { outline: none; border-color: #4f46e5; }
  .remove-btn {
    background: #fee2e2;
    color: #dc2626;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
    transition: background 0.2s;
  }
  .remove-btn:hover { background: #fecaca; }
  .add-btn {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-top: 10px;
    transition: background 0.2s;
  }
  .add-btn:hover { background: #4338ca; }
  .calculate-btn {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    border: none;
    padding: 16px 32px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    width: 100%;
    margin-top: 25px;
    transition: transform 0.2s;
  }
  .calculate-btn:hover { transform: translateY(-2px); }
  .results { margin-top: 30px; display: none; }
  .results.show { display: block; }
  .result-card {
    background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 15px;
  }
  .result-card h3 {
    font-size: 14px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .result-value { font-size: 42px; font-weight: 800; color: #4f46e5; }
  .result-sub { font-size: 14px; color: #666; margin-top: 5px; }
  .breakdown {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-top: 15px;
  }
  .breakdown h4 { font-size: 15px; margin-bottom: 15px; color: #333; }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .breakdown-row:last-child { border-bottom: none; font-weight: 700; }
  .scale-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 13px;
  }
  .scale-table th, .scale-table td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
  }
  .scale-table th { background: #f9fafb; font-weight: 600; color: #666; }
  footer {
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: #999;
    border-top: 1px solid #f0f0f0;
  }
  @media (max-width: 600px) {
    .subject-row { grid-template-columns: 1fr 1fr 40px; }
    .subject-row .subject-name { grid-column: 1 / -1; }
    .header-row { display: none; }
    header h1 { font-size: 22px; }
    .result-value { font-size: 32px; }
  }

  </header>

    <button class="add-btn" onclick="addSubject()">+ Add Subject</button>
    <button class="calculate-btn" onclick="calculate()">Calculate</button>

    <div class="results" id="results">

    </div>
  </div>

  <footer>
    Free GPA calculator. No sign-up required. Works worldwide.

</div>

// ===== STATE =====
let currentSystem = 'us';
let subjects = [];

function defaultSubjects(count) {
  const arr = [];
  for (let i = 0; i < count; i++) {
    arr.push({ name: 'Subject ' + (i + 1), gradeIndex: 0, percent: '' });
  }
  return arr;
}

// ===== RENDER =====
function renderSystem() {
  const sys = SYSTEMS[currentSystem];
  document.getElementById('infoBox').innerHTML = sys.info;
  document.getElementById('gpaLabel').textContent = sys.gpaLabel;
  document.getElementById('gpaSub').textContent = sys.gpaSub;
  document.getElementById('scaleTitle').textContent = 'Grading Scale — ' + sys.name;

  // APS card only for South Africa
  document.getElementById('apsCard').style.display = sys.aps ? 'block' : 'none';

  // Scale table
  const table = document.getElementById('scaleTable');
  table.innerHTML =
    '<tr><th>Grade</th><th>Range</th><th>Description</th><th>' + (sys.aps ? 'APS Points' : 'GPA Value') + '</th></tr>' +
    sys.scale.map(row => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`).join('');

  renderSubjects();
  document.getElementById('results').classList.remove('show');
}

function renderSubjects() {
  const sys = SYSTEMS[currentSystem];
  const container = document.getElementById('subjects');
  container.innerHTML = '';
  subjects.forEach((sub, i) => {
    const row = document.createElement('div');
    row.className = 'subject-row';
    row.innerHTML = `
      <input class="subject-name" type="text" value="${sub.name}" onchange="updateSubject(${i}, 'name', this.value)" placeholder="Subject / Course">
      <select onchange="updateSubject(${i}, 'gradeIndex', this.value)">
        ${sys.grades.map((g, gi) => `<option value="${gi}" ${sub.gradeIndex == gi ? 'selected' : ''}>${g.label}</option>`).join('')}
      </select>
      <input type="number" min="0" max="100" value="${sub.percent || ''}" placeholder="%" onchange="updateSubject(${i}, 'percent', this.value)">
      <button class="remove-btn" onclick="removeSubject(${i})">×</button>
    `;
    container.appendChild(row);
  });
}

function updateSubject(i, field, value) {
  if (field === 'gradeIndex') value = parseInt(value);
  if (field === 'percent') value = Math.min(100, Math.max(0, parseInt(value) || 0));
  subjects[i][field] = value;
}

function addSubject() {
  subjects.push({ name: 'Subject ' + (subjects.length + 1), gradeIndex: 0, percent: '' });
  renderSubjects();
}

function removeSubject(i) {
  if (subjects.length <= 1) return;
  subjects.splice(i, 1);
  renderSubjects();
}

function changeSystem() {
  currentSystem = document.getElementById('country').value;
  const sys = SYSTEMS[currentSystem];
  subjects = defaultSubjects(sys.subjectCount);
  renderSystem();
}

// ===== CALCULATE =====
function calculate() {
  if (subjects.length === 0) return;
  const sys = SYSTEMS[currentSystem];

  let totalPoints = 0;
  const rows = [];

  subjects.forEach(sub => {
    const g = sys.grades[sub.gradeIndex] || sys.grades[0];
    totalPoints += g.value;
    rows.push({ name: sub.name, label: g.label, value: g.value });
  });

  const avg = totalPoints / subjects.length;

  let displaySub = sys.gpaSub;
  if (currentSystem === 'ph') displaySub = 'GWA (1.0 = highest, 5.0 = failing)';

  document.getElementById('gpaValue').textContent = avg.toFixed(2);
  document.getElementById('gpaSub').textContent = displaySub;

  // APS for South Africa only
  if (sys.aps) {
    const sorted = [...rows].sort((a, b) => b.value - a.value);
    const bestSix = sorted.slice(0, Math.min(6, sorted.length));
    const aps = bestSix.reduce((s, r) => s + r.value, 0);
    document.getElementById('apsValue').textContent = aps;
  }

  // Breakdown
  const breakdown = document.getElementById('breakdown');
  breakdown.innerHTML = rows.map(r =>
    `<div class="breakdown-row"><span>${r.name} — ${r.label}</span><span>${r.value.toFixed(2)}</span></div>`
  ).join('') + `<div class="breakdown-row"><span>${currentSystem === 'ph' ? 'GWA' : 'Weighted Average'}</span><span>${avg.toFixed(2)}</span></div>`;

  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}

// ===== INIT =====
subjects = defaultSubjects(SYSTEMS.us.subjectCount);
renderSystem();
</script>
</body>
